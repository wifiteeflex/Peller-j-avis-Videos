<!DOCTYPE html>
<html>
<head>
  <meta name="monetag" content="a78fe65ffe9f64ef55f11bb2da4430c2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 20px;
    }

    button {
      background: #00c853;
      color: #fff;
      border: none;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(0, 200, 83, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
    }

    .video-title {
      margin-top: 18px;
      font-size: 15px;
      color: #ddd;
      line-height: 1.5;
    }

    #countdownBox {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      border: 2px solid #00c853;
      padding: 25px 30px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      z-index: 9999;
    }

    #count {
      font-size: 36px;
      color: #00c853;
      display: block;
      margin-top: 10px;
    }

    /* 👀 VIEWERS */
    #viewers {
      margin-top:10px;
      font-size:13px;
      color:#ccc;
      font-weight:bold;
    }

    /* 💬 COMMENTS */
    #commentsBox {
      margin-top:15px;
      max-width:360px;
      margin-left:auto;
      margin-right:auto;
      text-align:left;
      font-size:13px;
    }

    /* 🇺🇸 POPUP */
    #livePopup {
      position:fixed;
      bottom:20px;
      left:20px;
      background:#111;
      color:#fff;
      padding:10px 14px;
      border-radius:8px;
      font-size:12px;
      display:none;
      z-index:9999;
      box-shadow:0 0 10px rgba(0,0,0,0.5);
    }

  </style>
</head>

<body>
  
<h1>Click Play to watch the Full Video</h1>
<p>The video will play shortly.</p>

<button id="playBtn">PLAY ▶️</button>

<div class="video-title">
  Please like, comment, and subscribe 🤲❤️
</div>

<img src="https://i.ibb.co/0RhrY5K6/Screenshot-20251227-131734-3.jpg"
     style="width:100%;max-width:360px;border-radius:8px;margin-top:15px;">

<!-- 👀 VIEWERS -->
<div id="viewers">👀 842,531 people watching now</div>

<!-- 💬 COMMENTS -->
<div id="commentsBox">
  <div><b>Daniel <span style="color:#3b82f6;">✔</span>:</b> This video shocked me 😳</div>
  <div><b>Sarah <span style="color:#3b82f6;">✔</span>:</b> I wasn't expecting that ending 😭</div>
  <div><b>Mike <span style="color:#3b82f6;">✔</span>:</b> Worth watching fr 🔥</div>
</div>

<!-- 🇺🇸 LIVE POPUP -->
<div id="livePopup">🇺🇸 John just unlocked the video</div>

<div id="countdownBox">
  Your video starts in
  <span id="count">20</span>
</div>

<script>
  const monetagLinks = [
    "https://otieu.com/4/7533041",
    "https://otieu.com/4/7461956",
    "https://otieu.com/4/8859017",
    "https://otieu.com/4/7461922",
    "https://otieu.com/4/8676459",
    "https://otieu.com/4/9295877"
  ];

  const youtubeLink = "https://youtube.com/shorts/SCha0-skg5o?si=2cm023CcFcTqy78j";

  const playBtn = document.getElementById("playBtn");
  const countdownBox = document.getElementById("countdownBox");
  const countEl = document.getElementById("count");

  playBtn.onclick = function () {
    const random = Math.floor(Math.random() * monetagLinks.length);
    window.open(monetagLinks[random], "_blank");

    playBtn.style.display = "none";
    countdownBox.style.display = "block";

    let timeLeft = 20;
    const timer = setInterval(() => {
      timeLeft--;
      countEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = youtubeLink;
      }
    }, 1000);
  };

  // 👀 VIEWERS
  setInterval(()=>{
    let num = Math.floor(600000 + Math.random() * 400000);
    document.getElementById("viewers").innerHTML =
      "👀 " + num.toLocaleString() + " people watching now";
  }, 3000);

  // 💬 COMMENTS
  const comments = [
    "This video shocked me 😳",
    "I can't believe this is real 😭",
    "Wait for it... it's crazy 🔥",
    "I watched twice already 😅",
    "This is wild fr",
    "Nah this is insane 😂"
  ];

  const names = ["Daniel","Sarah","Mike","John","Emma","Chris"];

  setInterval(()=>{
    const box = document.getElementById("commentsBox");

    const name = names[Math.floor(Math.random()*names.length)];
    const text = comments[Math.floor(Math.random()*comments.length)];

    const newComment = document.createElement("div");
    newComment.innerHTML =
      "<b>" + name + " <span style='color:#3b82f6;'>✔</span>:</b> " + text;

    box.prepend(newComment);

    if(box.children.length > 6){
      box.removeChild(box.lastChild);
    }
  }, 4000);

  // 🇺🇸 POPUP
  const popupNames = ["John","Mike","David","Chris"];
  const countries = ["🇺🇸 USA","🇬🇧 UK","🇨🇦 Canada"];

  setInterval(()=>{
    const popup = document.getElementById("livePopup");

    const name = popupNames[Math.floor(Math.random()*popupNames.length)];
    const country = countries[Math.floor(Math.random()*countries.length)];

    popup.innerHTML = `${country} ${name} just unlocked the video`;

    popup.style.display = "block";

    setTimeout(()=>{
      popup.style.display = "none";
    }, 3000);

  }, 5000);

</script>

</body>
  </html>
