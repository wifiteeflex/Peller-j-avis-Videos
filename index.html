<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Chat Jobs</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
}

/* HEADER */
.header{
  background:#0a66c2;
  color:white;
  padding:15px;
  font-size:18px;
  text-align:center;
}

/* CONTAINER */
.container{
  max-width:400px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* TITLE */
h1{
  color:#0a66c2;
  font-size:22px;
}

.timer{
  font-size:32px;
  color:red;
  margin:15px 0;
}

/* OPTIONS */
.option{
  border:2px solid #0a66c2;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.option.active{
  background:#e7f3ff;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  background:#0a66c2;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:15px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

/* HIDE PAGES */
.page{display:none;}
.page.active{display:block;}
</style>
</head>

<body>

<div class="header">Remote Chat Support Jobs</div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <div class="container">
    <h1>Chat and Earn in Dollars 💬💰</h1>
    <p>Work remotely by chatting online with clients.</p>

    <div class="timer" id="timer">02:00</div>

    <p>Select how many hours you can work:</p>

    <div class="option" onclick="selectOption(this)">2 hrs/day</div>
    <div class="option" onclick="selectOption(this)">5 hrs/day</div>
    <div class="option" onclick="selectOption(this)">8 hrs/day</div>

    <button onclick="goNext()">Register Now</button>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <div class="container">
    <h1>Register Now</h1>
    <p>Fill your details to start working.</p>

    <input placeholder="Full Name">
    <input placeholder="Age">
    <input placeholder="Phone Number">
    <input placeholder="Email Address">

    <button onclick="submitForm()">Submit</button>
  </div>
</div>

<script>

// TIMER
let time = 120;
setInterval(()=>{
  let m = Math.floor(time/60);
  let s = time%60;
  document.getElementById("timer").innerText =
    `${m}:${s<10?'0'+s:s}`;
  if(time>0) time--;
},1000);

// SELECT OPTION
let selected = false;

function selectOption(el){
  document.querySelectorAll(".option").forEach(o=>o.classList.remove("active"));
  el.classList.add("active");
  selected = true;
}

// GO NEXT PAGE
function goNext(){
  if(!selected){
    alert("Please select working hours");
    return;
  }

  // OPEN MONETAG IN NEW TAB
  window.open("https://omg10.com/4/7461956", "_blank");

  // SWITCH PAGE (LIKE REAL PAGE LOAD)
  document.getElementById("page1").classList.remove("active");
  document.getElementById("page2").classList.add("active");
}

// SUBMIT FORM
function submitForm(){

  alert("🎉 Congratulations! You have successfully registered.");

  // OPEN SECOND MONETAG
  window.open("https://omg10.com/4/7533041", "_blank");
}

</script>

</body>
  </html>
