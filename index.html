<!DOCTYPE html>
<html>
<head>
  <meta name="monetag" content="a78fe65ffe9f64ef55f11bb2da4430c2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 15px;
    }

    button {
      background: #00c853;
      color: #fff;
      border: none;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .video-title {
      margin-top: 15px;
      font-size: 14px;
      color: #ddd;
    }

    .cta-box {
      margin: 16px auto;
      padding: 14px;
      background: #111;
      border-radius: 10px;
      font-weight: bold;
      color: #facc15;
      max-width: 90%;
      animation: glow 1.5s infinite;
    }

    @keyframes glow {
      0% { box-shadow: 0 0 5px #facc15; }
      50% { box-shadow: 0 0 15px #facc15; }
      100% { box-shadow: 0 0 5px #facc15; }
    }

    .viewers {
      font-size: 13px;
      color: #aaa;
      margin-top: 6px;
    }

    .warning {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 8px;
      font-weight: bold;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.4; }
    }

    /* 🔥 fake progress bar */
    .progress {
      width: 90%;
      height: 8px;
      background: #222;
      margin: 15px auto;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #00c853;
      animation: load 6s linear infinite;
    }

    @keyframes load {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    #countdownBox {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      border: 2px solid #00c853;
      padding: 25px;
      border-radius: 10px;
      font-size: 22px;
      z-index: 9999;
    }

    #count {
      font-size: 36px;
      color: #00c853;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>

<body onclick="triggerAd()">

<h1>Click Play to watch the Full Video</h1>
<p>Loading secure video stream...</p>

<button id="playBtn">PLAY ▶️</button>

<div class="progress">
  <div class="bar"></div>
</div>

<div class="video-title">
  Please like, comment, and subscribe 🤲❤️
</div>

<img src="https://i.ibb.co/0RhrY5K6/Screenshot-20251227-131734-3.jpg"
     style="width:100%;max-width:360px;border-radius:8px;margin-top:12px;">

<div class="cta-box">
  🔒 Premium content locked<br>
  Click PLAY to unlock full video
  <div class="viewers" id="viewers">👀 8,532 people watching</div>
  <div class="warning">⚠️ Only 3 free views remaining...</div>
</div>

<div id="countdownBox">
  Your video starts in
  <span id="count">20</span>
</div>

<script>
  const monetagLinks = [
    "https://otieu.com/4/7533041",
    "https://otieu.com/4/7461956",
    "https://otieu.com/4/8859017",
    "https://otieu.com/4/7461922",
    "https://otieu.com/4/8676459",
    "https://otieu.com/4/9295877",
    "https://otieu.com/4/8729428",
    "https://otieu.com/4/8642746",
    "https://otieu.com/4/8659455",
    "https://otieu.com/4/8770744"
  ];

  const youtubeLink = "https://youtube.com/shorts/SCha0-skg5o?si=2cm023CcFcTqy78j";

  const playBtn = document.getElementById("playBtn");
  const countdownBox = document.getElementById("countdownBox");
  const countEl = document.getElementById("count");

  function getRandomAd(){
    return monetagLinks[Math.floor(Math.random() * monetagLinks.length)];
  }

  function triggerAd(){
    window.open(getRandomAd(), "_blank");
  }

  playBtn.onclick = function (e) {
    e.stopPropagation();

    window.open(getRandomAd(), "_blank");

    playBtn.style.display = "none";
    countdownBox.style.display = "block";

    let timeLeft = 20;
    const timer = setInterval(() => {
      timeLeft--;
      countEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = youtubeLink;
      }
    }, 1000);
  };

  // 🔥 live viewers counter
  setInterval(()=>{
    const viewers = document.getElementById("viewers");
    let num = 8000 + Math.floor(Math.random() * 2000);
    viewers.innerHTML = "👀 " + num + " people watching";
  }, 3000);
</script>

</body>
</html>
