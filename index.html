<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Live Stream Test</title>
  
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org"></script>
  
  <!-- Video.js Player Styles -->
  <link href="https://zencdn.net" rel="stylesheet" />
  
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .app-card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .header {
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
      background: #111827;
    }

    /* Video Player Sizing Constraints */
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-js {
      width: 100% !important;
      height: 100% !important;
    }

    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #ef4444;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      z-index: 10;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .details {
      padding: 16px;
    }

    .match-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .match-desc {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">📺 TMA Live Stream Sandbox</div>
    
    <div class="video-container">
      <div class="status-badge">● LIVE</div>
      
      <!-- Video Element configured for Telegram WebView sandbox -->
      <video
        id="tg-live-player"
        class="video-js vjs-default-skin vjs-big-play-centered"
        controls
        preload="auto"
        playsinline
        webkit-playsinline
        muted>
        <!-- Open-source sample HLS (.m3u8) live stream link -->
        <source src="https://akamaized.net" type="application/x-mpegURL">
      </video>
    </div>

    <div class="details">
      <div class="match-title">Test Match: Dev FC vs User United</div>
      <div class="match-desc">Testing low-latency live streaming integration inside a Telegram Mini App framework using HLS over Akamai CDN.</div>
    </div>
  </div>

  <!-- Video.js Engine JavaScript Core -->
  <script src="https://zencdn.net"></script>
  
  <script>
    // 1. Tell Telegram the App is Ready to Render
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Force the Mini App to fill the full height of the Telegram screen

    // 2. Initialize the Video Player Instance
    const player = videojs('tg-live-player', {
      autoplay: 'any', // Bypasses browser restrictions by staying muted on load
      fluid: true,
      liveui: true,    // Activates modern UI specialized for live broadcasts
      responsive: true
    });
  </script>
</body>
</html>
