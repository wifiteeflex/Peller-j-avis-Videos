<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat & Earn</title>

<style>
body{
  font-family: Arial;
  background:#fff;
  text-align:center;
  padding:20px;
}

h1{color:green;}
.timer{font-size:40px;color:red;margin:20px;}

.option{
  border:2px solid green;
  padding:15px;
  margin:10px;
  border-radius:10px;
  cursor:pointer;
}

button{
  background:green;
  color:#fff;
  border:none;
  padding:15px;
  width:100%;
  border-radius:10px;
  font-size:18px;
}

#form{display:none;}
</style>
</head>

<body>

<h1>Chat and Earn in Dollar</h1>
<p>Unlock financial opportunities by chatting online.</p>

<div class="timer" id="timer">02:00</div>

<p>Select working hours:</p>

<div class="option" onclick="selectOption(this)">2hrs/day</div>
<div class="option" onclick="selectOption(this)">5hrs/day</div>
<div class="option" onclick="selectOption(this)">8hrs/day</div>

<button onclick="continueStep()">Continue</button>

<!-- FORM -->
<div id="form">
  <h2>Register Now</h2>
  <input placeholder="Full Name"><br><br>
  <input placeholder="Age"><br><br>
  <input placeholder="Phone"><br><br>
  <input placeholder="Email"><br><br>
  <button onclick="submitForm()">Submit</button>
</div>

<script>
// TIMER
let time = 120;
setInterval(()=>{
  let m = Math.floor(time/60);
  let s = time%60;
  document.getElementById("timer").innerText =
    `${m}:${s<10?'0'+s:s}`;
  if(time>0) time--;
},1000);

// SELECT
let selected = false;
function selectOption(el){
  document.querySelectorAll(".option").forEach(o=>o.style.background="");
  el.style.background="#d4ffd4";
  selected = true;
}

// CONTINUE
function continueStep(){
  if(!selected){
    alert("Select option first");
    return;
  }

  // OPEN MONETAG LINK
  window.open("YOUR_MONETAG_LINK", "_blank");

  // SHOW FORM
  document.getElementById("form").style.display = "block";
}

// SUBMIT
function submitForm(){
  alert("🎉 Congratulations! Registration successful!");

  // TRIGGER SECOND AD
  window.open("YOUR_MONETAG_LINK", "_blank");
}
</script>

</body>
  </html>
