<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Chat Jobs</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.header{background:#0a66c2;color:#fff;padding:15px;text-align:center;font-weight:bold;}
.container{max-width:400px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
h1{color:#0a66c2;font-size:22px;}
.timer{font-size:30px;color:red;margin:10px 0;}
.option{border:2px solid #0a66c2;padding:12px;margin:10px 0;border-radius:10px;cursor:pointer;font-weight:bold;}
.option.active{background:#e7f3ff;}
button{width:100%;padding:14px;background:#0a66c2;color:#fff;border:none;border-radius:10px;font-size:16px;margin-top:10px;}
input, select{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;}
.notice{background:#fff3cd;padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;}
.link{color:#0a66c2;font-weight:bold;cursor:pointer;display:block;margin-top:10px;}
.page{display:none;}
.page.active{display:block;}
</style>
</head>

<body>

<div class="header">Remote Chat Support Jobs</div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <div class="container">
    <h1>Chat and Earn in Dollars 💬💰</h1>
    <p>Work remotely chatting with clients worldwide.</p>
    <div class="notice">⚠️ Only 15 positions left today</div>
    <div class="timer" id="timer">02:00</div>

    <div class="option" onclick="selectOption(this)">2 hrs/day</div>
    <div class="option" onclick="selectOption(this)">5 hrs/day</div>
    <div class="option" onclick="selectOption(this)">8 hrs/day</div>

    <button onclick="goNext()">Continue</button>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <div class="container">
    <h1>Register Now</h1>

    <select id="country">
      <option value="">Select Country</option>
      <option>Nigeria</option>
      <option>United States</option>
    </select>

    <input id="name" placeholder="Full Name">
    <input id="age" placeholder="Age">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">

    <button onclick="submitForm()">Submit</button>
  </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <div class="container">
    <h1>Email Verification</h1>

    <div class="timer" id="verifyTimer">05:00</div>

    <input id="code" placeholder="Enter code">

    <button onclick="verifyCode()">Verify Code</button>

    <span id="helpBtn" class="link" style="display:none;" onclick="openAd()">
      Didn’t receive code? Click here
    </span>
  </div>
</div>

<script>

// TIMER
let time=120;
setInterval(()=>{
 let m=Math.floor(time/60);
 let s=time%60;
 document.getElementById("timer").innerText=`${m}:${s<10?'0'+s:s}`;
 if(time>0)time--;
},1000);

// SELECT
let selected=false;
function selectOption(el){
 document.querySelectorAll(".option").forEach(o=>o.classList.remove("active"));
 el.classList.add("active");
 selected=true;
}

// NEXT
function goNext(){
 if(!selected){alert("Select hours");return;}
 window.open("https://omg10.com/4/8729428","_blank");
 document.getElementById("page1").classList.remove("active");
 document.getElementById("page2").classList.add("active");
}

// SUBMIT
function submitForm(){
 let name=document.getElementById("name").value;
 if(!name){alert("Fill form");return;}

 alert("Submitting...");

 setTimeout(()=>{
  alert("Check your email for code");
  window.open("https://omg10.com/4/8676459","_blank");

  document.getElementById("page2").classList.remove("active");
  document.getElementById("page3").classList.add("active");

  startVerifyTimer();
 },1000);
}

// VERIFY TIMER
function startVerifyTimer(){
 let time=300;

 let interval=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;

  document.getElementById("verifyTimer").innerText=
  `${m}:${s<10?'0'+s:s}`;

  if(time===0){
   document.getElementById("helpBtn").style.display="block";
   clearInterval(interval);
  }

  time--;
 },1000);
}

// VERIFY
function verifyCode(){
 let code=document.getElementById("code").value;

 if(code!=="12345"){
  alert("Wrong code");
  window.open("https://omg10.com/4/8729428","_blank");
  return;
 }

 alert("Success!");
 window.open("https://omg10.com/4/8676459","_blank");
}

// HELP
function openAd(){
 window.open("https://omg10.com/4/8729428","_blank");
}

</script>

</body>
  </html>
