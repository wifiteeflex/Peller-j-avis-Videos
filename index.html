<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMA YouTube Live Stream</title>
  
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org"></script>
  
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .app-card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .header {
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
      background: #111827;
    }

    /* Responsive video container for 16:9 ratio */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background: #000;
    }

    /* Targets the dynamic iframe injected by YouTube */
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .details {
      padding: 16px;
    }

    .match-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .match-desc {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">⚽ Live Sports Broadcast</div>
    
    <!-- YouTube API will dynamically inject the video frame here -->
    <div class="video-container">
      <div id="youtube-player"></div>
    </div>

    <div class="details">
      <div class="match-title">SportyTV / YouTube Live Match</div>
      <div class="match-desc">Streaming live match broadcasts natively inside the Telegram Mini App container via the official embedded player API.</div>
    </div>
  </div>

  <script>
    // 1. Initialize Telegram WebApp Settings
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 2. Load the official YouTube IFrame Player API asynchronously
    const tag = document.createElement('script');
    tag.src = "https://youtube.com";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 3. This function executes automatically once the API script finishes loading
    let player;
    function onYouTubeIframeAPIReady() {
  player = new YT.Player('youtube-player', {
    
    // Paste your SportyTV live match ID here:
    videoId: 'cjdO-vQx1Ak', 
    
    playerVars: {
      'playsinline': 1,   // Keeps the stream locked inside Telegram
      'autoplay': 1,      // Starts playback automatically
      'mute': 1,          // Required by Telegram to bypass autoplay blocks
      'controls': 1,      // Shows play/pause and fullscreen options
      'rel': 0            // Hides competitor channels
    },
    events: {
      'onReady': onPlayerReady
    }
  });
}

    function onPlayerReady(event) {
      // Play the stream as soon as the player initializes
      event.target.playVideo();
    }
  </script>
</body>
</html>
