<!DOCTYPE html>
<html>
<head>
<meta name="monetag" content="a78fe65ffe9f64ef55f11bb2da4430c2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial;
  text-align: center;
  padding: 60px 20px;
}

h1 { font-size: 24px; margin-bottom: 10px; }
p { color: #ccc; }

button {
  background: #00c853;
  color: #fff;
  border: none;
  padding: 16px 28px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

.video-box {
  display: none;
  margin-top: 20px;
}

video {
  width:100%;
  max-width:360px;
  border-radius:8px;
}

.actions {
  display:none;
  justify-content:space-around;
  margin-top:12px;
  max-width:360px;
  margin-left:auto;
  margin-right:auto;
}

.actions div {
  cursor:pointer;
  color:#00e676;
  font-weight:bold;
}

.status {
  margin-top: 15px;
  font-weight: bold;
  color: #facc15;
}
</style>
</head>

<body>

<h1>Click Play to watch the Full Video</h1>
<p>Complete steps to unlock video</p>

<button id="playBtn">PLAY ▶️</button>

<div class="status" id="statusText"></div>

<!-- VIDEO -->
<div class="video-box" id="videoBox">
  <video id="video" muted playsinline>
    <source src="https://cdn.streamable.com/video/mp4/5qok3m.mp4" type="video/mp4">
  </video>
</div>

<!-- ACTIONS -->
<div class="actions" id="actions">
  <div id="likeBtn">👍 Like</div>
  <div id="shareBtn">🔁 Share</div>
</div>

<script>
const monetagLinks = [
"https://otieu.com/4/7533041",
"https://otieu.com/4/7461956",
"https://otieu.com/4/8859017",
"https://otieu.com/4/7461922",
"https://otieu.com/4/8676459",
"https://otieu.com/4/9295877",
"https://otieu.com/4/8729428",
"https://otieu.com/4/8642746",
"https://otieu.com/4/8659455",
"https://otieu.com/4/8770744"
];

function goAd(){
  const random = Math.floor(Math.random() * monetagLinks.length);
  window.open(monetagLinks[random], "_blank");
}

let step = 0;

const playBtn = document.getElementById("playBtn");
const statusText = document.getElementById("statusText");
const actions = document.getElementById("actions");
const video = document.getElementById("video");
const videoBox = document.getElementById("videoBox");
const likeBtn = document.getElementById("likeBtn");
const shareBtn = document.getElementById("shareBtn");

// STEP 1 - PLAY
playBtn.onclick = function(){
  goAd();
  step = 1;

  playBtn.style.display = "none";
  statusText.innerHTML = "✅ Step 1 completed<br>👉 Click LIKE to continue";

  actions.style.display = "flex";
};

// STEP 2 - LIKE
likeBtn.onclick = function(){
  if(step !== 1) return;

  goAd();
  step = 2;

  statusText.innerHTML = "✅ Step 2 completed<br>👉 Final step: Click SHARE to unlock";
};

// STEP 3 - SHARE (FINAL)
shareBtn.onclick = function(){
  if(step !== 2) return;

  goAd();
  step = 3;

  statusText.innerHTML = "🎉 Video unlocked! Playing now...";

  actions.style.display = "none";
  videoBox.style.display = "block";

  video.play();
};
</script>

</body>
</html>
